# Publishes ONLY the site/ folder to GitHub Pages (playludiq.com) on every
# push to main. The rest of the repository (skills, docs, tools) never goes
# online. One-time setup: GitHub -> Settings -> Pages -> Source: GitHub Actions.
# The site check runs first: unfilled legal pages or broken links stop the deploy.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as in GitHub's own Pages template: since Nov 2026 deploy-pages can
  # miss an artifact uploaded a split second earlier in the same job.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the site
        run: node tools/check-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

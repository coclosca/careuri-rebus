<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Integrame de Cultură Generală</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: vertical app — header, clue bar, grid, controls, clue lists. Palette: ink navy on warm paper, amber highlight. */
:root{
  --paper:#f4efe3; --card:#fbf8f0; --cell:#ffffff; --block:#23303d;
  --ink:#1f2a36; --muted:#6a7078; --line:#d8cfbb; --line2:#c3b89f;
  --accent:#1f6f8b; --accent-soft:#d7edf2;
  --hl:#f7d070; --hl-soft:#fdf0cf; --cur:#f4a93d;
  --good:#2f8f57; --bad:#c84a3f;
  --shadow:0 1px 0 #fff inset, 0 2px 8px rgba(40,30,10,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161b20; --card:#1e252c; --cell:#273039; --block:#0d1319;
  --ink:#e9e4d6; --muted:#9aa2ab; --line:#333d47; --line2:#44515d;
  --accent:#54b6cf; --accent-soft:#1d3942;
  --hl:#c9a23f; --hl-soft:#3a3115; --cur:#e0902a;
  --good:#5cc083; --bad:#e2695d;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 2px 10px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#161b20; --card:#1e252c; --cell:#273039; --block:#0d1319;
  --ink:#e9e4d6; --muted:#9aa2ab; --line:#333d47; --line2:#44515d;
  --accent:#54b6cf; --accent-soft:#1d3942;
  --hl:#c9a23f; --hl-soft:#3a3115; --cur:#e0902a;
  --good:#5cc083; --bad:#e2695d;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 2px 10px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}body{min-height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
.wrap{width:100%;max-width:560px;padding:0 16px 28px;display:flex;flex-direction:column;min-height:100%}
header{padding:16px 2px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-family:"Bricolage Grotesque",serif;font-weight:800;font-size:clamp(20px,6vw,27px);margin:0;letter-spacing:-.01em;line-height:1}
h1 small{display:block;font-family:"Source Sans 3";font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.tabs{display:flex;gap:7px;margin:2px 0 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--muted);
  font-family:inherit;font-weight:700;font-size:14px;padding:9px 6px;border-radius:11px;cursor:pointer;transition:.15s}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow)}
.tab .done{display:inline-block;margin-left:5px;color:var(--good)}
.tab[aria-selected="true"] .done{color:#eafff2}

.cluebar{display:flex;align-items:stretch;gap:0;flex:none;min-height:50px;background:var(--card);border:1px solid var(--line2);
  border-radius:13px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.cluebar button{appearance:none;border:0;background:transparent;color:var(--accent);font-size:22px;
  width:46px;flex:none;cursor:pointer;display:grid;place-items:center}
.cluebar button:active{background:var(--accent-soft)}
.clue{flex:1;padding:9px 6px;min-width:0;display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.clue .meta{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.clue .txt{font-size:15.5px;font-weight:600;line-height:1.25;text-wrap:balance}

.gridwrap{display:flex;justify-content:center}
#grid{display:grid;gap:2px;background:var(--line2);padding:3px;border-radius:8px;
  width:100%;box-shadow:var(--shadow);touch-action:manipulation}
.cell{position:relative;background:var(--cell);display:grid;place-items:center;aspect-ratio:1/1;
  font-family:"Bricolage Grotesque",serif;font-weight:700;font-size:clamp(13px,4.6vw,23px);
  color:var(--ink);cursor:pointer;border-radius:2px;user-select:none;text-transform:uppercase}
.cell.block{background:var(--block);cursor:default;border-radius:2px}
.cell .num{position:absolute;top:1px;left:2px;font-family:"Source Sans 3";font-weight:700;
  font-size:9px;line-height:1;color:var(--muted)}
.cell.hl{background:var(--hl-soft)}
.cell.cur{background:var(--cur);color:#1f2a36}
.cell.cur .num{color:#4a3a12}
.cell.good{color:var(--good)}
.cell.bad{color:var(--bad)}
.cell.bad::after{content:"";position:absolute;inset:0;border:2px solid var(--bad);border-radius:2px}

#hiddenInput{position:fixed;opacity:0;pointer-events:none;height:1px;width:1px;top:-100px;left:0;font-size:16px}

.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0 6px}
.controls button{appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--ink);
  font-family:inherit;font-weight:700;font-size:12.5px;padding:10px 4px;border-radius:11px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:.12s}
.controls button:active{transform:translateY(1px);background:var(--accent-soft)}
.controls button svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.lists{margin-top:16px;display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:460px){.lists{grid-template-columns:1fr 1fr}}
.lists h2{font-family:"Bricolage Grotesque";font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:0 0 6px;padding-bottom:5px;border-bottom:2px solid var(--line)}
.lists ol{list-style:none;margin:0;padding:0}
.lists li{display:flex;gap:7px;font-size:14px;padding:5px 7px;border-radius:7px;cursor:pointer;line-height:1.25}
.lists li:active{background:var(--accent-soft)}
.lists li.activeclue{background:var(--hl-soft);outline:1px solid var(--hl)}
.lists li b{color:var(--accent);font-weight:700;min-width:17px;text-align:right;flex:none}
.lists li.solved{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}

.overlay{position:fixed;inset:0;background:rgba(15,20,25,.58);display:none;place-items:center;padding:24px;z-index:9}
.overlay.on{display:grid}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:26px 24px;max-width:340px;
  text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{font-family:"Bricolage Grotesque";font-weight:800;font-size:23px;margin:0 0 6px}
.modal p{color:var(--muted);margin:0 0 18px;font-size:15px}
.modal .big{font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;color:var(--accent);margin:6px 0 14px;font-family:"Bricolage Grotesque"}
.modal .row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.modal button{appearance:none;border:0;border-radius:11px;padding:11px 16px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--ink)}
footer{margin-top:auto;padding-top:18px;text-align:center;color:var(--muted);font-size:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>Pe teme · Joacă &amp; învață</small>Integrame tematice</h1>
    <div class="timer" id="timer">00:00</div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="cluebar">
    <button id="prevClue" aria-label="Definiția anterioară">‹</button>
    <div class="clue"><span class="meta" id="clueMeta">Orizontal 1</span><span class="txt" id="clueTxt">—</span></div>
    <button id="nextClue" aria-label="Definiția următoare">›</button>
  </div>

  <div class="gridwrap"><div id="grid"></div></div>
  <input id="hiddenInput" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-hidden="true">

  <div class="controls">
    <button id="bCheck"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Verifică</button>
    <button id="bHint"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 0 0-4-10z"/><path d="M9 21h6"/></svg>Un indiciu</button>
    <button id="bReveal"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.5"/></svg>Dezvăluie</button>
    <button id="bClear"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>Șterge</button>
  </div>

  <div class="lists">
    <div><h2>Orizontal</h2><ol id="listA"></ol></div>
    <div><h2>Vertical</h2><ol id="listD"></ol></div>
  </div>

  <footer>Atinge o căsuță și scrie literele. Atinge din nou ca să schimbi orizontal / vertical.</footer>
</div>

<div class="overlay" id="overlay"><div class="modal">
  <h3 id="mTitle">Felicitări!</h3>
  <p id="mSub">Ai completat careul.</p>
  <div class="big" id="mTime">00:00</div>
  <div class="row">
    <button class="btn-primary" id="mNext">Careul următor</button>
    <button class="btn-ghost" id="mClose">Închide</button>
  </div>
</div></div>

let pi=0, P=null, dir="A", cur={r:0,c:0}, state=[], solvedOnce=false;

function renderTimer(){ const m=String(Math.floor(secs/60)).padStart(2,"0"), s=String(secs%60).padStart(2,"0"); $("timer").textContent=m+":"+s; }

function cellKey(r,c){return r+"_"+c;}
function isCell(r,c){ return P.grid[r] && P.grid[r][c]; }

function wordAt(r,c,d){
  if(!isCell(r,c)) return null;
  let sr=r, sc=c;
  if(d==="A"){ while(isCell(sr,sc-1)) sc--; }
  else{ while(isCell(sr-1,sc)) sr--; }

function entryFor(r,c,d){

  const list = d==="A"?P.across:P.down;

function buildGrid(){
  gridEl.style.gridTemplateColumns=`repeat(${P.cols},1fr)`;
  gridEl.innerHTML="";
  for(let r=0;r<P.rows;r++)for(let c=0;c<P.cols;c++){
    const g=P.grid[r][c];
    const d=document.createElement("div");
    d.className="cell"+(g?"":" block");
    if(g){
      d.dataset.r=r; d.dataset.c=c;
      if(g.num){ const n=document.createElement("span"); n.className="num"; n.textContent=g.num; d.appendChild(n); }
      const t=document.createElement("span"); t.className="lt"; d.appendChild(t);
    }
    gridEl.appendChild(d);
  }
}
function cellDiv(r,c){ return gridEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`); }

    if(!isCell(r,c)) continue;
    const dv=cellDiv(r,c); const lt=dv.querySelector(".lt");
    lt.textContent=state[r][c]||"";
    dv.classList.remove("good","bad");
  }
}
function highlight(){
  gridEl.querySelectorAll(".cell.hl,.cell.cur").forEach(e=>e.classList.remove("hl","cur"));

  w.cells.forEach(({r,c})=>cellDiv(r,c).classList.add("hl"));
  cellDiv(cur.r,cur.c).classList.remove("hl"); cellDiv(cur.r,cur.c).classList.add("cur");

function focusHidden(){ try{ hidden.value=""; hidden.focus({preventScroll:true}); }catch(e){} }

  if(i+1<w.cells.length){ cur=w.cells[i+1]; }
  highlight();

function retreat(){
  const w=wordAt(cur.r,cur.c,dir); if(!w) return;
  const i=w.cells.findIndex(x=>x.r===cur.r&&x.c===cur.c);

function del(){
  if(state[cur.r][cur.c]){ state[cur.r][cur.c]=""; cellDiv(cur.r,cur.c).querySelector(".lt").textContent=""; }
  else retreat();
  if(state[cur.r][cur.c]!==undefined){ state[cur.r][cur.c]=""; const lt=cellDiv(cur.r,cur.c).querySelector(".lt"); if(lt) lt.textContent=""; }

function checkWin(){

  else if(e.key==="ArrowLeft"){ e.preventDefault(); move(0,-1); }
  else if(e.key==="ArrowDown"){ e.preventDefault(); move(1,0); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); move(-1,0); }
  else if(e.key===" "||e.key==="Enter"){ e.preventDefault(); dir=dir==="A"?"D":"A"; if(!wordAt(cur.r,cur.c,dir)) dir=dir==="A"?"D":"A"; highlight(); }
  else if(/^[a-zA-Z]$/.test(e.key)){ /* handled by input on mobile; desktop: */ }
});
document.addEventListener("keydown",e=>{
  if(document.activeElement===hidden) return;
  if(/^[a-zA-Z]$/.test(e.key)){ typeLetter(e.key); }
  else if(e.key==="Backspace"){ e.preventDefault(); del(); }
});

$("prevClue").onclick=()=>cycleClue(-1);
$("nextClue").onclick=()=>cycleClue(1);

$("bCheck").onclick=()=>{
  let anyWrong=false;
  for(let r=0;r<P.rows;r++)for(let c=0;c<P.cols;c++){
    if(!isCell(r,c)) continue; const dv=cellDiv(r,c); dv.classList.remove("good","bad");
    if(state[r][c]){ if(norm(state[r][c])===P.grid[r][c].ch) dv.classList.add("good"); else {dv.classList.add("bad");anyWrong=true;} }
  }
  setTimeout(()=>gridEl.querySelectorAll(".good,.bad").forEach(e=>e.classList.remove("good","bad")),1600);
};
$("bHint").onclick=()=>{
  state[cur.r][cur.c]=P.grid[cur.r][cur.c].ch;
  cellDiv(cur.r,cur.c).querySelector(".lt").textContent=P.grid[cur.r][cur.c].ch;
  if(!running){running=true;startTimer();}
  persist(); advance(); checkWin();
};
$("bReveal").onclick=()=>{
  const w=wordAt(cur.r,cur.c,dir); if(!w) return;
  w.cells.forEach(({r,c})=>{ state[r][c]=P.grid[r][c].ch; cellDiv(r,c).querySelector(".lt").textContent=P.grid[r][c].ch; });
  persist(); checkWin(); highlight();
};
$("bClear").onclick=()=>{
  for(let r=0;r<P.rows;r++)for(let c=0;c<P.cols;c++){ if(isCell(r,c)){ state[r][c]=""; } }
  secs=0; running=false; solvedOnce=false;
  renderLetters(); renderTimer(); markSolvedClues(); persist(); highlight();
};
$("mClose").onclick=()=>$("overlay").classList.remove("on");
$("mNext").onclick=()=>{ $("overlay").classList.remove("on"); loadPuzzle((pi+1)%PUZZLES.length); };

buildTabs();
loadPuzzle(0);
</script>
</body>

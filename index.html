<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Integrame, Rebus &amp; altele</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: vertical app — header, clue bar, grid, controls, clue lists. Palette: ink navy on warm paper, amber highlight. */
:root{
  --paper:#f4efe3; --card:#fbf8f0; --cell:#ffffff; --block:#23303d;
  --ink:#1f2a36; --muted:#6a7078; --line:#d8cfbb; --line2:#c3b89f;
  --accent:#1f6f8b; --accent-soft:#d7edf2;
  --hl:#f7d070; --hl-soft:#fdf0cf; --cur:#f4a93d;
  --good:#2f8f57; --bad:#c84a3f;
  --shadow:0 1px 0 #fff inset, 0 2px 8px rgba(40,30,10,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161b20; --card:#1e252c; --cell:#273039; --block:#0d1319;
  --ink:#e9e4d6; --muted:#9aa2ab; --line:#333d47; --line2:#44515d;
  --accent:#54b6cf; --accent-soft:#1d3942;
  --hl:#c9a23f; --hl-soft:#3a3115; --cur:#e0902a;
  --good:#5cc083; --bad:#e2695d;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 2px 10px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#161b20; --card:#1e252c; --cell:#273039; --block:#0d1319;
  --ink:#e9e4d6; --muted:#9aa2ab; --line:#333d47; --line2:#44515d;
  --accent:#54b6cf; --accent-soft:#1d3942;
  --hl:#c9a23f; --hl-soft:#3a3115; --cur:#e0902a;
  --good:#5cc083; --bad:#e2695d;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 2px 10px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-skin="clasic"]{--paper:#eceef0;--card:#ffffff;--cell:#ffffff;--block:#161616;--ink:#161616;--muted:#5c636b;--line:#c6ccd2;--line2:#2b2b2b;--accent:#1b1b1b;--accent-soft:#e4e4e4;--hl:#ffd23f;--hl-soft:#fff3c4;--cur:#ffd23f;--good:#1f8a4c;--bad:#c62828;color-scheme:light}
:root[data-skin="noapte"]{--paper:#12161b;--card:#1b2127;--cell:#263039;--block:#0a0f14;--ink:#e8e3d6;--muted:#9aa2ab;--line:#2e3740;--line2:#45525d;--accent:#56b7cf;--accent-soft:#163139;--hl:#caa23f;--hl-soft:#3a3115;--cur:#e0902a;--good:#5cc083;--bad:#e2695d;color-scheme:dark}
:root[data-skin="azur"]{--paper:#e6f0f8;--card:#f5fafe;--cell:#ffffff;--block:#163a56;--ink:#13293d;--muted:#5a7183;--line:#cfe0ec;--line2:#9cc0d8;--accent:#1769aa;--accent-soft:#d3e9f7;--hl:#ffcf5c;--hl-soft:#fdeec2;--cur:#f4a93d;--good:#2f8f57;--bad:#c84a3f;color-scheme:light}
:root[data-skin="sepia"]{--paper:#ece0cb;--card:#f8efdd;--cell:#fffaf0;--block:#5b4327;--ink:#3f3321;--muted:#7a6c52;--line:#d9c9a8;--line2:#bda676;--accent:#9a6a2b;--accent-soft:#eaddc2;--hl:#e9c46a;--hl-soft:#f6e7c2;--cur:#d9a441;--good:#5a7a3a;--bad:#b5503a;color-scheme:light}
.skins{display:flex;gap:9px;align-items:center;margin:2px 0 14px;flex-wrap:wrap}
.skins .lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);cursor:pointer;padding:0;overflow:hidden}
.swatch.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
*{box-sizing:border-box}
html{height:100%}body{min-height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
.wrap{width:100%;max-width:560px;padding:0 16px 28px;display:flex;flex-direction:column;min-height:100%}
header{padding:16px 2px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-family:"Bricolage Grotesque",serif;font-weight:800;font-size:clamp(20px,6vw,27px);margin:0;letter-spacing:-.01em;line-height:1}
h1 small{display:block;font-family:"Source Sans 3";font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
.picker-wrap{margin:2px 0 14px}
.picker-wrap>label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sel{position:relative}
.sel::after{content:"▾";position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--accent);font-size:13px}
#picker{width:100%;appearance:none;-webkit-appearance:none;-moz-appearance:none;background:var(--card);color:var(--ink);
  border:1px solid var(--line2);border-radius:12px;padding:13px 42px 13px 15px;font-family:inherit;font-weight:700;
  font-size:16px;cursor:pointer;box-shadow:var(--shadow)}
#picker:focus{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:8px;margin:0 0 12px}
.act{flex:1;appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-weight:700;font-size:13px;padding:10px 6px;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.12s}
.act:active{transform:translateY(1px);background:var(--accent-soft)}
.act span{font-size:15px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;pointer-events:none;transition:.25s;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.minirow{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.minirow button{appearance:none;border:1px solid var(--line2);background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.12s}
.minirow button:active{background:var(--accent-soft)}
#bLike.on{color:var(--bad);border-color:var(--bad)}

.cluebar{display:flex;align-items:stretch;gap:0;flex:none;min-height:50px;background:var(--card);border:1px solid var(--line2);
  border-radius:13px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.cluebar button{appearance:none;border:0;background:transparent;color:var(--accent);font-size:22px;
  width:46px;flex:none;cursor:pointer;display:grid;place-items:center}
.cluebar button:active{background:var(--accent-soft)}
.clue{flex:1;padding:9px 6px;min-width:0;display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.clue .meta{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.clue .txt{font-size:15.5px;font-weight:600;line-height:1.25;text-wrap:balance}

.gridwrap{display:flex;justify-content:center}
#grid{display:grid;gap:2px;background:var(--line2);padding:3px;border-radius:8px;
  width:100%;box-shadow:var(--shadow);touch-action:manipulation}
.cell{position:relative;background:var(--cell);display:grid;place-items:center;aspect-ratio:1/1;
  font-family:"Bricolage Grotesque",serif;font-weight:700;font-size:clamp(13px,4.6vw,23px);
  color:var(--ink);cursor:pointer;border-radius:2px;user-select:none;text-transform:uppercase}
.cell.block{background:var(--block);cursor:default;border-radius:2px}
.cell .num{position:absolute;top:1px;left:2px;font-family:"Source Sans 3";font-weight:700;
  font-size:9px;line-height:1;color:var(--muted)}
.cell.hl{background:var(--hl-soft)}
.cell.cur{background:var(--cur);color:#1f2a36}
.cell.cur .num{color:#4a3a12}
.cell.good{color:var(--good)}
.cell.bad{color:var(--bad)}
.cell.bad::after{content:"";position:absolute;inset:0;border:2px solid var(--bad);border-radius:2px}

#hiddenInput{position:fixed;opacity:0;pointer-events:none;height:1px;width:1px;top:-100px;left:0;font-size:16px}

.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0 6px}
.controls button{appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--ink);
  font-family:inherit;font-weight:700;font-size:12.5px;padding:10px 4px;border-radius:11px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:.12s}
.controls button:active{transform:translateY(1px);background:var(--accent-soft)}
.controls button svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.lists{margin-top:16px;display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:460px){.lists{grid-template-columns:1fr 1fr}}
.lists h2{font-family:"Bricolage Grotesque";font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:0 0 6px;padding-bottom:5px;border-bottom:2px solid var(--line)}
.lists ol{list-style:none;margin:0;padding:0}
.lists li{display:flex;gap:7px;font-size:14px;padding:5px 7px;border-radius:7px;cursor:pointer;line-height:1.25}
.lists li:active{background:var(--accent-soft)}
.lists li.activeclue{background:var(--hl-soft);outline:1px solid var(--hl)}
.lists li b{color:var(--accent);font-weight:700;min-width:17px;text-align:right;flex:none}
.lists li.solved{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}

.overlay{position:fixed;inset:0;background:rgba(15,20,25,.58);display:none;place-items:center;padding:24px;z-index:9}
.overlay.on{display:grid}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:26px 24px;max-width:340px;
  text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{font-family:"Bricolage Grotesque";font-weight:800;font-size:23px;margin:0 0 6px}
.modal p{color:var(--muted);margin:0 0 18px;font-size:15px}
.modal .big{font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;color:var(--accent);margin:6px 0 14px;font-family:"Bricolage Grotesque"}
.modal .row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.modal button{appearance:none;border:0;border-radius:11px;padding:11px 16px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--ink)}
footer{margin-top:auto;padding-top:18px;text-align:center;color:var(--muted);font-size:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>Jocuri de minte · și altele</small>Integrame &amp; Rebus</h1>
    <div class="timer" id="timer">00:00</div>
  </header>

  <div class="skins" id="skins"><span class="lbl">Fundal</span></div>
  <div class="picker-wrap">
    <label for="picker">Alege careul</label>
    <div class="sel"><select id="picker" aria-label="Alege careul"></select></div>
  </div>
  <div class="actions">
    <button id="bRandom" class="act"><span>🎲</span> Careu la întâmplare</button>
    <button id="bShare" class="act"><span>↗</span> Trimite prietenilor</button>
  </div>

  <div class="cluebar">
    <button id="prevClue" aria-label="Definiția anterioară">‹</button>
    <div class="clue"><span class="meta" id="clueMeta">Orizontal 1</span><span class="txt" id="clueTxt">—</span></div>
    <button id="nextClue" aria-label="Definiția următoare">›</button>
  </div>

  <div class="gridwrap"><div id="grid"></div></div>
  <input id="hiddenInput" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-hidden="true">

  <div class="controls">
    <button id="bCheck"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Verifică</button>
    <button id="bHint"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 0 0-4-10z"/><path d="M9 21h6"/></svg>Un indiciu</button>
    <button id="bReveal"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.5"/></svg>Dezvăluie</button>
    <button id="bClear"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>Șterge</button>
  </div>

  <div class="lists">
    <div><h2>Orizontal</h2><ol id="listA"></ol></div>
    <div><h2>Vertical</h2><ol id="listD"></ol></div>
  </div>

  <div class="minirow">
    <button id="bLike">🤍 Îmi place</button>
    <button id="bReport">⚠️ Raportează o greșeală</button>
  </div>
  <footer>Atinge o căsuță și scrie literele. Atinge din nou ca să schimbi orizontal / vertical.</footer>
</div>

<div class="overlay" id="overlay"><div class="modal">
  <h3 id="mTitle">Felicitări!</h3>
  <p id="mSub">Ai completat careul.</p>
  <div class="big" id="mTime">00:00</div>
  <div class="row">
    <button class="btn-primary" id="mNext">Careul următor</button>
    <button class="btn-ghost" id="mClose">Închide</button>
  </div>
</div></div>

  if(!isCell(r,c)) return;
  if(toggle && cur.r===r && cur.c===c){ dir = dir==="A"?"D":"A"; if(!wordAt(r,c,dir)) dir=dir==="A"?"D":"A"; }
  else if(!wordAt(r,c,dir)){ dir=dir==="A"?"D":"A"; }
  cur={r,c};
  highlight();
  focusHidden();
}
function focusHidden(){ try{ hidden.value=""; hidden.focus({preventScroll:true}); }catch(e){} }

function advance(){
  const w=wordAt(cur.r,cur.c,dir); if(!w) return;
  const i=w.cells.findIndex(x=>x.r===cur.r&&x.c===cur.c);
  for(let j=i+1;j<w.cells.length;j++){ if(!state[w.cells[j].r][w.cells[j].c]){ cur=w.cells[j]; highlight(); return; } }
  if(i+1<w.cells.length){ cur=w.cells[i+1]; }
  highlight();
}
function retreat(){
  const w=wordAt(cur.r,cur.c,dir); if(!w) return;
  const i=w.cells.findIndex(x=>x.r===cur.r&&x.c===cur.c);
  if(i>0){ cur=w.cells[i-1]; highlight(); }
}
function typeLetter(ch){
  ch=norm(ch); if(!ch) return;
  if(!running){ running=true; startTimer(); }
  state[cur.r][cur.c]=ch[0];
  cellDiv(cur.r,cur.c).querySelector(".lt").textContent=ch[0];
  cellDiv(cur.r,cur.c).classList.remove("good","bad");
  persist(); advance(); checkWin();
}
function del(){
  if(state[cur.r][cur.c]){ state[cur.r][cur.c]=""; cellDiv(cur.r,cur.c).querySelector(".lt").textContent=""; }
  else retreat();
  if(state[cur.r][cur.c]!==undefined){ state[cur.r][cur.c]=""; const lt=cellDiv(cur.r,cur.c).querySelector(".lt"); if(lt) lt.textContent=""; }
  cellDiv(cur.r,cur.c).classList.remove("good","bad");
  persist();
}
function move(dr,dc){
  let r=cur.r+dr,c=cur.c+dc;
  while(r>=0&&r<P.rows&&c>=0&&c<P.cols&&!isCell(r,c)){ r+=dr;c+=dc; }
  if(isCell(r,c)){ dir = dr!==0?"D":"A"; if(!wordAt(r,c,dir)) dir=dir==="A"?"D":"A"; cur={r,c}; highlight(); focusHidden(); }
}

function persist(){ store[pi]={g:state.map(row=>row.map(x=>x||"")), t:secs, done:solvedOnce}; save(); markSolvedClues(); }

function checkWin(){
  for(let r=0;r<P.rows;r++)for(let c=0;c<P.cols;c++){
    if(isCell(r,c) && norm(state[r][c])!==P.grid[r][c].ch) return false;
  }
  running=false; solvedOnce=true; persist();
  $("mTime").textContent=$("timer").textContent;
  $("overlay").classList.add("on");
  updatePicker();
  return true;
}
function wordSolved(e,d){
  const w=wordAt(e.row,e.col,d); if(!w) return false;
  return w.cells.every(({r,c})=>norm(state[r][c])===P.grid[r][c].ch);
}
function markSolvedClues(){
  P.across.forEach(e=>{ const li=document.querySelector(`.lists li[data-d="A"][data-n="${e.num}"]`); if(li) li.classList.toggle("solved",wordSolved(e,"A")); });
  P.down.forEach(e=>{ const li=document.querySelector(`.lists li[data-d="D"][data-n="${e.num}"]`); if(li) li.classList.toggle("solved",wordSolved(e,"D")); });
}

function buildLists(){
  const mk=(list,d,el)=>{ el.innerHTML=""; list.forEach(e=>{
    const li=document.createElement("li"); li.dataset.d=d; li.dataset.n=e.num;
    li.innerHTML=`<b>${e.num}</b><span>${e.clue}</span>`;
    li.onclick=()=>{ dir=d; select(e.row,e.col,false); };
    el.appendChild(li);
  });};
  mk(P.across,"A",$("listA")); mk(P.down,"D",$("listD"));
}

function buildPicker(){
  const sel=$("picker"); sel.innerHTML="";
  const cats=[]; PUZZLES.forEach(p=>{const c=p.cat||"Teme"; if(!cats.includes(c))cats.push(c);});
  cats.forEach(c=>{
    const og=document.createElement("optgroup"); og.label=c;
    PUZZLES.forEach((p,i)=>{ if((p.cat||"Teme")===c){
      const o=document.createElement("option"); o.value=i; o.dataset.base=p.name; o.textContent=p.name; og.appendChild(o);
    }});
    sel.appendChild(og);
  });
  sel.onchange=()=>loadPuzzle(+sel.value);
}
function updatePicker(){
  const sel=$("picker"); if(!sel) return;
  Array.from(sel.options).forEach(o=>{ const i=+o.value; o.textContent=((store[i]&&store[i].done)?"✓ ":"")+(o.dataset.base||PUZZLES[i].name); });
  sel.value=pi;
}

function firstClue(){
  if(P.across.length){ dir="A"; select(P.across[0].row,P.across[0].col,false); }
  else if(P.down.length){ dir="D"; select(P.down[0].row,P.down[0].col,false); }
}
function cycleClue(step){
  const order=[...P.across.map(e=>({e,d:"A"})),...P.down.map(e=>({e,d:"D"}))];
  const e=entryFor(cur.r,cur.c,dir);
  let idx=order.findIndex(o=>o.d===dir && o.e.num===(e?e.num:-1));
  if(idx<0) idx=0;
  idx=(idx+step+order.length)%order.length;
  dir=order[idx].d; select(order[idx].e.row,order[idx].e.col,false);
}

function loadPuzzle(i){
  pi=i; P=PUZZLES[i];
  state=Array.from({length:P.rows},()=>Array(P.cols).fill(""));
  secs=0; running=false; solvedOnce=false;
  if(store[i]){
    if(store[i].g) store[i].g.forEach((row,r)=>row.forEach((v,c)=>{ if(isCell(r,c)) state[r][c]=v||""; }));
    secs=store[i].t||0; solvedOnce=!!store[i].done;
  }
  buildGrid(); buildLists(); renderLetters(); renderTimer();
  firstClue(); markSolvedClues(); updatePicker();
  if(timerId){clearInterval(timerId);timerId=null;}
  startTimer(); if(secs>0&&!solvedOnce) running=false;
}

/* events */
gridEl.addEventListener("click",e=>{
  const dv=e.target.closest(".cell"); if(!dv||dv.classList.contains("block")) return;
  select(+dv.dataset.r,+dv.dataset.c,true);
});
hidden.addEventListener("input",e=>{
  const v=e.target.value; e.target.value="";
  for(const ch of v){ const n=norm(ch); if(n) typeLetter(n); }
});
hidden.addEventListener("keydown",e=>{
  if(e.key==="Backspace"){ e.preventDefault(); del(); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); move(0,1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); move(0,-1); }
  else if(e.key==="ArrowDown"){ e.preventDefault(); move(1,0); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); move(-1,0); }
  else if(e.key===" "||e.key==="Enter"){ e.preventDefault(); dir=dir==="A"?"D":"A"; if(!wordAt(cur.r,cur.c,dir)) dir=dir==="A"?"D":"A"; highlight(); }
  else if(/^[a-zA-Z]$/.test(e.key)){ /* handled by input on mobile; desktop: */ }
});
document.addEventListener("keydown",e=>{
  if(document.activeElement===hidden) return;
  if(/^[a-zA-Z]$/.test(e.key)){ typeLetter(e.key); }
  else if(e.key==="Backspace"){ e.preventDefault(); del(); }
});

$("prevClue").onclick=()=>cycleClue(-1);
$("nextClue").onclick=()=>cycleClue(1);

$("bCheck").onclick=()=>{
  let anyWrong=false;
  for(let r=0;r<P.rows;r++)for(let c=0;c<P.cols;c++){
    if(!isCell(r,c)) continue; const dv=cellDiv(r,c); dv.classList.remove("good","bad");
    if(state[r][c]){ if(norm(state[r][c])===P.grid[r][c].ch) dv.classList.add("good"); else {dv.classList.add("bad");anyWrong=true;} }
  }
  setTimeout(()=>gridEl.querySelectorAll(".good,.bad").forEach(e=>e.classList.remove("good","bad")),1600);
};
$("bHint").onclick=()=>{
  state[cur.r][cur.c]=P.grid[cur.r][cur.c].ch;
  cellDiv(cur.r,cur.c).querySelector(".lt").textContent=P.grid[cur.r][cur.c].ch;
  if(!running){running=true;startTimer();}
  persist(); advance(); checkWin();
};
$("bReveal").onclick=()=>{
  const w=wordAt(cur.r,cur.c,dir); if(!w) return;
  w.cells.forEach(({r,c})=>{ state[r][c]=P.grid[r][c].ch; cellDiv(r,c).querySelector(".lt").textContent=P.grid[r][c].ch; });
  persist(); checkWin(); highlight();
};
$("bClear").onclick=()=>{
  for(let r=0;r<P.rows;r++)for(let c=0;c<P.cols;c++){ if(isCell(r,c)){ state[r][c]=""; } }
  secs=0; running=false; solvedOnce=false;
  renderLetters(); renderTimer(); markSolvedClues(); persist(); highlight();
};
$("mClose").onclick=()=>$("overlay").classList.remove("on");
$("mNext").onclick=()=>{ $("overlay").classList.remove("on"); loadPuzzle((pi+1)%PUZZLES.length); };

const SHARE_URL="https://coclosca.github.io/careuri-rebus/";
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
$("bRandom").onclick=()=>{let n;do{n=Math.floor(Math.random()*PUZZLES.length);}while(PUZZLES.length>1&&n===pi);loadPuzzle(n);};
$("bShare").onclick=async()=>{try{if(navigator.share){await navigator.share({title:"Careuri & Rebus",text:"Joacă integrame și rebus gratis:",url:SHARE_URL});}else{await navigator.clipboard.writeText(SHARE_URL);toast("Link copiat ✓");}}catch(e){try{await navigator.clipboard.writeText(SHARE_URL);toast("Link copiat ✓");}catch(_){toast(SHARE_URL);}}};
const REPORT_FORM_URL="https://forms.gle/wpvRtTFxxNjmib5j6";
let liked=false; try{liked=localStorage.getItem("ic_liked")==="1";}catch(e){}
function renderLike(){const b=$("bLike"); b.innerHTML=(liked?"❤️":"🤍")+" Îmi place"; b.classList.toggle("on",liked);}
$("bLike").onclick=()=>{liked=!liked; try{localStorage.setItem("ic_liked",liked?"1":"0");}catch(e){} renderLike(); if(liked) toast("Mulțumesc! ❤️");};
renderLike();
$("bReport").onclick=()=>{
  if(REPORT_FORM_URL){ const a=document.createElement("a"); a.href=REPORT_FORM_URL; a.target="_blank"; a.rel="noopener"; a.click(); }
  else { toast("Formular de raportare — în curând"); }
};
const SKINS=[{id:"",name:"Hârtie",a:"#f4efe3",b:"#23303d"},{id:"clasic",name:"Clasic",a:"#ffffff",b:"#161616"},{id:"noapte",name:"Noapte",a:"#1b2127",b:"#56b7cf"},{id:"azur",name:"Azur",a:"#eaf2fa",b:"#163a56"},{id:"sepia",name:"Sepia",a:"#f3e8d2",b:"#5b4327"}];
let skin=""; try{skin=localStorage.getItem("ic_skin")||"";}catch(e){}
function applySkin(id){ if(id){document.documentElement.setAttribute("data-skin",id);} else {document.documentElement.removeAttribute("data-skin");} try{localStorage.setItem("ic_skin",id);}catch(e){} document.querySelectorAll(".swatch").forEach(w=>w.classList.toggle("on",(w.dataset.id||"")===id)); }
function buildSkins(){ const c=$("skins"); SKINS.forEach(sk=>{ const w=document.createElement("button"); w.className="swatch"; w.dataset.id=sk.id; w.title=sk.name; w.setAttribute("aria-label","Fundal "+sk.name); w.style.background="linear-gradient(135deg,"+sk.a+" 0 50%,"+sk.b+" 50% 100%)"; w.onclick=()=>applySkin(sk.id); c.appendChild(w); }); applySkin(skin); }
buildSkins();
buildPicker();
loadPuzzle(0);
</script>
</body>
</html>

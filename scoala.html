<!DOCTYPE html>
<html lang="ro"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste Școlare — Educație Muzicală</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2563a8"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4efe3;--ink:#23303d;--accent:#2563a8;--accent2:#c9872a;--card:#fffdf8;--line:#d9cfba;--good:#2f8f5b;--bad:#c23b3b;--muted:#6b6454;--shadow:0 5px 15px rgba(20,40,40,.14);--info:#e8f0fa;--infoline:#a9c6e8;--fact:#fbf3df;--factline:#e4c98a;--chip:#eaf1fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#161d24;--ink:#eef2f4;--accent:#5b9be0;--card:#1f2932;--line:#36424d;--muted:#9aa4ad;--shadow:0 6px 20px rgba(0,0,0,.4);--info:#182636;--infoline:#2d4b6e;--fact:#2a2418;--factline:#5c4a22;--chip:#1b2836}}
*{margin:0;box-sizing:border-box}html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px 14px calc(18px + env(safe-area-inset-bottom))}
.backlink{align-self:flex-start;color:var(--accent);font-weight:700;text-decoration:none;font-size:13px;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer}
.wrap{width:100%;max-width:500px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:4px}
h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:clamp(20px,5.5vw,26px);line-height:1}
h1 small{display:block;font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:700;font-size:13px;box-shadow:var(--shadow);white-space:nowrap}
.stat b{color:var(--accent)}
.subject{text-align:center;font-weight:700;color:var(--muted);font-size:14px;margin:2px 0 14px}
.subject b{color:var(--accent)}
.pick-h{text-align:center;font-weight:700;color:var(--muted);margin:2px 0 12px;font-size:14px}
.list{display:grid;gap:11px}
.mbtn{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;cursor:pointer;box-shadow:var(--shadow);font-family:inherit;color:inherit;text-align:left;width:100%}
.mbtn:active{transform:scale(.985)}
.mbtn .n{width:40px;height:40px;flex:none;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:17px;line-height:1}
.mbtn.comb .n{background:var(--accent2)}
.mbtn>span:nth-child(2){flex:1;min-width:0}
.mbtn .tt{display:block;font-weight:800;font-size:15.5px;line-height:1.18}
.mbtn .mt{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.mbtn .per{display:block;font-size:11px;color:var(--accent);font-weight:700;margin-top:3px}
.mbtn .go{margin-left:auto;font-size:20px;opacity:.45;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:10.5px;font-weight:700;background:var(--chip);color:var(--accent);border:1px solid var(--infoline);border-radius:999px;padding:2px 8px}
.modhead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);margin-bottom:14px}
.modhead .mh-t{font-family:"Bricolage Grotesque";font-weight:800;font-size:17px}
.modhead .mh-s{font-size:13px;color:var(--muted);margin-top:2px}
.modhead .mh-p{font-size:12px;color:var(--accent);font-weight:700;margin-top:4px}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.qbox .qn{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qbox .cmp{background:var(--chip);border:1px solid var(--infoline);border-radius:999px;padding:1px 8px;font-size:10px;letter-spacing:.02em;text-transform:none}
.qbox .qt{font-family:"Bricolage Grotesque";font-weight:700;font-size:clamp(17px,4.3vw,21px);line-height:1.25}
.opts{display:grid;gap:10px}
.opt{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:700;font-size:16px;padding:14px;border-radius:13px;cursor:pointer;box-shadow:var(--shadow);text-align:left;transition:.1s;display:flex;gap:10px;align-items:center}
.opt .lt{width:26px;height:26px;flex:none;border-radius:7px;background:var(--line);color:var(--ink);display:grid;place-items:center;font-size:14px}
.opt:active{transform:scale(.98)}
.opt.correct{background:var(--good);color:#fff;border-color:var(--good)}.opt.correct .lt{background:rgba(255,255,255,.25);color:#fff}
.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}.opt.wrong .lt{background:rgba(255,255,255,.25);color:#fff}
.opt.dim{opacity:.5}
.box{margin-top:12px;border-radius:14px;padding:13px 15px;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.box .bl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.box .bt{font-size:15px;line-height:1.45}
.explain{background:var(--info);border:1px solid var(--infoline)}.explain .bl{color:var(--accent)}
.factb{background:var(--fact);border:1px solid var(--factline)}.factb .bl{color:var(--accent2)}
.foot{margin-top:14px;display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
button.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
button.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.result{text-align:center;padding:24px 10px}
.result .big{font-family:"Bricolage Grotesque";font-weight:800;font-size:56px;color:var(--accent);line-height:1}
.result .msg{font-size:17px;margin:10px 0 6px;font-weight:600}
.result .sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.hidden{display:none}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:22px;opacity:.85;line-height:1.5}
</style><script src="view.js" defer></script>
</head>
<body>
<a class="backlink" id="back" href="index.html">&#8592; Meniu</a>
<div class="wrap">
  <header><h1><small>Teste școlare</small>Test</h1><div class="stat hidden" id="scoreWrap">Scor <b id="score">0</b></div></header>
  <div class="subject">📚 <b id="subj"></b> · Clasa <span id="clasa"></span></div>

  <!-- MODULE -->
  <div id="pickMod">
    <div class="pick-h">Alege modulul 👇</div>
    <div class="list" id="mods"></div>
  </div>

  <!-- TESTE -->
  <div id="pickTest" class="hidden">
    <div class="modhead"><div class="mh-t" id="mhTitle"></div><div class="mh-s" id="mhTheme"></div><div class="mh-p" id="mhPer"></div><div class="chips" id="mhChips"></div></div>
    <div class="pick-h">Alege testul 👇</div>
    <div class="list" id="tests"></div>
  </div>

  <!-- QUIZ -->
  <div id="game" class="hidden">
    <div class="bar"><i id="barI"></i></div>
    <div class="qbox"><div class="qn"><span id="qn"></span><span class="cmp" id="cmp"></span></div><div class="qt" id="qt"></div></div>
    <div class="opts" id="opts"></div>
    <div class="box explain hidden" id="explain"><div class="bl">✅ Explicație</div><div class="bt" id="explainText"></div></div>
    <div class="box factb hidden" id="fact"><div class="bl">💡 Știați că…?</div><div class="bt" id="factText"></div></div>
    <div class="foot"><button class="btn primary hidden" id="next">Următoarea &#8594;</button></div>
  </div>

  <!-- END -->
  <div id="end" class="result hidden">
    <div class="big" id="finalScore">0/0</div>
    <div class="msg" id="finalMsg"></div>
    <div class="sub" id="finalSub"></div>
    <div class="foot"><button class="btn primary" id="againTest">Alt test din modul</button><button class="btn" id="againMod">Alt modul</button></div>
  </div>

  <footer>© 2026 · <b>PlayLudiq</b>™ · Corneliu · Toate drepturile rezervate<br>Teste aliniate la programă și manual · versiune beta</footer>
</div>

<script>
const DATA={"subject":"Educație Muzicală","clasa":"a V-a","manual":"Ed. ART Klett, 2022","modules":[{"id":1,"name":"Modulul I","theme":"Cântul vocal și elemente de limbaj muzical","per":"7 sept – 23 oct","sapt":"săpt. 1–7","tests":[{"n":"Test 1 · Vocea, portativul și notele","cmp":["1.1","2.1","1.2"],"q":[{"q":"Câte linii are portativul?","opts":["4","5","6"],"c":1,"cmp":"2.1","e":"Portativul are 5 linii și 4 spații, pe care se scriu notele.","f":"Înainte de portativ, muzica se nota cu semne numite neume, scrise deasupra textului."},{"q":"Ce cheie se folosește de obicei la începutul portativului, în clasa a V-a?","opts":["Cheia sol","Cheia fa","Cheia do"],"c":0,"cmp":"2.1","e":"Cheia sol (cheia violinei) este cea mai folosită.","f":"Semnul cheii sol este, de fapt, litera G stilizată."},{"q":"Pe ce linie a portativului se fixează nota sol în cheia sol?","opts":["Linia 1","Linia a 2-a","Linia a 3-a"],"c":1,"cmp":"2.1","e":"Cheia sol încolăcește linia a doua — de aceea se și numește așa.","f":""},{"q":"Câte note muzicale de bază există?","opts":["5","7","8"],"c":1,"cmp":"2.1","e":"Cele 7 note: do, re, mi, fa, sol, la, si.","f":"Numele notelor vin dintr-un imn latin, alese de Guido d'Arezzo."},{"q":"Care este ordinea corectă a notelor, urcând?","opts":["do re mi fa sol la si","do mi sol do","si la sol fa"],"c":0,"cmp":"2.1","e":"Notele urcă în ordinea: do, re, mi, fa, sol, la, si.","f":""},{"q":"Pentru a cânta corect o frază lungă, respirația se ia:","opts":["oricând, în mijlocul cuvântului","liniștit, înainte de frază sau la pauze","doar pe gură, zgomotos"],"c":1,"cmp":"1.1","e":"Respirația corectă se ia înainte de frază sau la pauze, ca să nu rupem cuvintele.","f":""},{"q":"O dicție bună în cânt înseamnă:","opts":["să cânți cât mai tare","să pronunți clar cuvintele","să cânți cât mai repede"],"c":1,"cmp":"1.1","e":"Dicția bună înseamnă rostirea clară a cuvintelor, ca să se înțeleagă textul.","f":""},{"q":"Înălțimea unui sunet ne arată dacă el este:","opts":["tare sau încet","înalt (ascuțit) sau grav (jos)","lung sau scurt"],"c":1,"cmp":"2.1","e":"Înălțimea deosebește sunetele ascuțite de cele grave.","f":"Urechea omului aude sunete de la circa 20 până la 20.000 de vibrații pe secundă."},{"q":"Un instrument care susține în fundal o melodie cântată cu vocea oferă:","opts":["un acompaniament","o pauză","un solfegiu"],"c":0,"cmp":"1.2","e":"Acompaniamentul este partea instrumentală care însoțește și susține melodia vocală.","f":"La chitară sau pian, acompaniamentul cântă acorduri sub melodia solistului."},{"q":"A cânta „la unison” înseamnă:","opts":["fiecare cântă altă melodie","toți cântă aceeași melodie împreună","cântă doar solistul"],"c":1,"cmp":"1.1","e":"La unison, toate vocile cântă exact aceeași melodie, pe aceeași înălțime.","f":"„Unison” vine din latină: un singur sunet."}]},{"n":"Test 2 · Profil melodic, pulsație și măsură","cmp":["1.1","2.1","2.3","3.1"],"q":[{"q":"Când melodia urcă, profilul melodic este:","opts":["ascendent","descendent","orizontal"],"c":0,"cmp":"2.1","e":"Profil ascendent = melodia urcă spre sunete tot mai înalte.","f":""},{"q":"Când melodia coboară, profilul melodic este:","opts":["ascendent","descendent","în salturi"],"c":1,"cmp":"2.1","e":"Profil descendent = melodia coboară spre sunete tot mai grave.","f":""},{"q":"Mersul melodic „treptat” înseamnă că melodia:","opts":["sare peste note","merge din notă în notă vecină","stă pe loc"],"c":1,"cmp":"2.1","e":"La mersul treptat, melodia înaintează pe note alăturate, fără salturi.","f":""},{"q":"Un „salt” melodic înseamnă că:","opts":["se trece la o notă vecină","se sare peste una sau mai multe note","se face o pauză"],"c":1,"cmp":"2.1","e":"La salt, melodia trece peste una sau mai multe note, nu merge treptat.","f":""},{"q":"Pulsația muzicală seamănă cu:","opts":["bătaia regulată a pașilor","o pauză lungă","un instrument"],"c":0,"cmp":"1.1","e":"Pulsația e bătaia regulată care se simte în muzică, ca pașii la mers.","f":"Când bați din palme regulat pe un cântec, simți pulsația lui."},{"q":"Măsura împarte muzica în:","opts":["culori","porțiuni egale, cu același număr de timpi","versuri"],"c":1,"cmp":"2.1","e":"Măsura grupează timpii în porțiuni egale, despărțite prin bare.","f":""},{"q":"Liniile verticale care despart măsurile se numesc:","opts":["bare de măsură","chei","portative"],"c":0,"cmp":"2.1","e":"Barele de măsură taie portativul și separă măsurile.","f":""},{"q":"Semnul de repetiție ne cere să:","opts":["oprim cântecul","repetăm o porțiune","cântăm mai tare"],"c":1,"cmp":"2.3","e":"Semnul de repetiție arată că o porțiune se cântă din nou.","f":"Așa, un cântec poate avea un refren repetat fără să-l rescriem de fiecare dată."},{"q":"Primul timp al măsurii este, de obicei:","opts":["accentuat (mai puternic)","tăcut","cel mai slab"],"c":0,"cmp":"1.1","e":"Accentul cade pe primul timp; de aceea simțim unde începe măsura.","f":""},{"q":"Două lucrări pot fi deosebite ascultând, printre altele:","opts":["doar culoarea hainelor","profilul melodic și ritmul lor","numărul de scaune"],"c":1,"cmp":"3.1","e":"Comparând melodia și ritmul, putem deosebi caracterul a două lucrări.","f":""}]}]},{"id":2,"name":"Modulul II","theme":"Ritmul muzical","per":"2 nov – 22 dec","sapt":"săpt. 8–14","tests":[{"n":"Test 1 · Duratele notelor și pauzele","cmp":["1.2","2.1","3.2"],"q":[{"q":"Care notă durează cel mai mult?","opts":["pătrimea","doimea","nota întreagă"],"c":2,"cmp":"2.1","e":"Nota întreagă ține 4 timpi; doimea 2; pătrimea 1.","f":""},{"q":"Câți timpi are doimea?","opts":["1","2","4"],"c":1,"cmp":"2.1","e":"Doimea valorează 2 timpi — cât două pătrimi.","f":""},{"q":"Pătrimea valorează:","opts":["1 timp","2 timpi","4 timpi"],"c":0,"cmp":"2.1","e":"Pătrimea ține un singur timp; e unitatea obișnuită de măsură.","f":""},{"q":"Două optimi fac împreună:","opts":["o pătrime","o doime","o notă întreagă"],"c":0,"cmp":"2.1","e":"Două optimi adunate dau o pătrime (un timp).","f":"Optimea se scrie cu o steguleță sau legată prin bară de altă optime."},{"q":"Șaisprezecimea este o notă:","opts":["mai lungă ca pătrimea","mai scurtă decât optimea","egală cu doimea"],"c":1,"cmp":"2.1","e":"Șaisprezecimea e și mai scurtă decât optimea — patru într-un timp.","f":""},{"q":"Pauza în muzică este:","opts":["un sunet lung","un moment de tăcere măsurat","un sunet înalt"],"c":1,"cmp":"2.1","e":"Pauza e tăcere cu durată exactă, la fel ca notele.","f":"Și tăcerea face parte din muzică: pauzele dau ritm și respirație."},{"q":"Fiecărei note îi corespunde o pauză:","opts":["de aceeași durată","fără durată","mereu mai lungă"],"c":0,"cmp":"2.1","e":"Există pauză de pătrime, de doime etc. — cu aceeași durată ca nota.","f":""},{"q":"Nota întreagă valorează cât:","opts":["2 pătrimi","3 pătrimi","4 pătrimi"],"c":2,"cmp":"2.1","e":"Nota întreagă = 4 pătrimi adunate.","f":""},{"q":"Duratele notelor se leagă între ele prin raporturi:","opts":["la întâmplare","matematice (se adună și se împart)","de culoare"],"c":1,"cmp":"3.2","e":"Ritmul se bazează pe raporturi matematice exacte între durate.","f":"Iată cum se întâlnesc muzica și matematica: ritmul e plin de fracții!"},{"q":"Legato de prelungire leagă două note:","opts":["de aceeași înălțime, adunându-le duratele","de înălțimi diferite","printr-o pauză"],"c":0,"cmp":"2.1","e":"Legato de prelungire unește două note identice într-un singur sunet mai lung.","f":""}]},{"n":"Test 2 · Măsura de 2 timpi, folclor și istorie","cmp":["1.1","2.1","3.1"],"q":[{"q":"Măsura de 2 timpi (2/4) are:","opts":["2 timpi","3 timpi","4 timpi"],"c":0,"cmp":"2.1","e":"Măsura 2/4 are doi timpi, fiecare de o pătrime.","f":""},{"q":"În măsura 2/4, o pătrime ține:","opts":["jumătate de timp","un timp","doi timpi"],"c":1,"cmp":"2.1","e":"Cifra 4 arată că pătrimea primește un timp.","f":""},{"q":"Măsura de 2 timpi este tipică pentru:","opts":["vals","marș","doină"],"c":1,"cmp":"3.1","e":"Marșul merge în 2 timpi, ca pașii: stânga-dreapta.","f":"De aceea muzica de defilare e aproape mereu în 2 timpi."},{"q":"  dirijor se numește:","opts":["orchestră","solist","duet"],"c":0,"cmp":"1.1","e":"Orchestra reunește zeci de instrumente conduse de dirijor.","f":""}]},{"n":"Test combinat 2","cmp":["2.1","2.3","3.1"],"q":[{"q":"Câte note muzicale de bază există?","opts":["5","7","8"],"c":1,"cmp":"2.1","e":"Cele 7 note: do, re, mi, fa, sol, la, si.","f":""},{"q":"Doimea valorează:","opts":["1 timp","2 timpi","4 timpi"],"c":1,"cmp":"2.1","e":"Doimea ține 2 timpi.","f":""},{"q":"Pauza în muzică este:","opts":["un sunet lung","un moment de tăcere măsurat","un sunet înalt"],"c":1,"cmp":"2.1","e":"Pauza e tăcere cu durată exactă.","f":""},{"q":"Termenul „allegro” înseamnă un tempo:","opts":["lent","vesel și rapid","foarte lent"],"c":1,"cmp":"2.3","e":"Allegro = repede, vioi.","f":""},{"q":"Vioara și violoncelul sunt instrumente cu:","opts":["coarde","suflat","percuție"],"c":0,"cmp":"2.3","e":"Sunetul lor vine din coarde.","f":""},{"q":"Colindele se cântă mai ales:","opts":["de Paște","de Crăciun","vara"],"c":1,"cmp":"3.1","e":"Colindele sunt cântece de iarnă, de Crăciun.","f":""},{"q":"Când melodia urcă, profilul melodic este:","opts":["ascendent","descendent","orizontal"],"c":0,"cmp":"2.1","e":"Profil ascendent = melodia urcă.","f":""},{"q":"Gama Do major se cântă la pian pe:","opts":["clapele albe","clapele negre","o singură clapă"],"c":0,"cmp":"2.1","e":"Do major folosește numai clapele albe.","f":""},{"q":"Creșterea treptată a intensității se numește:","opts":["crescendo","decrescendo","andante"],"c":0,"cmp":"2.3","e":"Crescendo = tot mai tare.","f":""},{"q":"Sunetul muzical are patru calități:","opts":["înălțime, durată, intensitate, timbru","doar înălțime","doar timbru"],"c":0,"cmp":"2.1","e":"Cele patru însușiri: înălțime, durată, intensitate, timbru.","f":""}]}]};
const $=i=>document.getElementById(i);
const LET=["A","B","C","D"];
let curMod=null,qs,idx,score,answered;
$("subj").textContent=DATA.subject;$("clasa").textContent=DATA.clasa;

function show(id){["pickMod","pickTest","game","end"].forEach(x=>$(x).classList.toggle("hidden",x!==id));}
function setBack(mode){
  const b=$("back");
  if(mode==="menu"){b.textContent="← Meniu";b.setAttribute("href","index.html");b.onclick=null;}
  else{b.removeAttribute("href");b.onclick=mode;}
}

// ---- module ----
function buildMods(){
  const box=$("mods");box.innerHTML="";
  DATA.modules.forEach(m=>{
    const b=document.createElement("button");b.className="mbtn";
    b.innerHTML='<span class="n">'+roman(m.id)+'</span><span><span class="tt">'+m.theme+'</span><span class="mt">'+m.name+' · '+m.tests.length+' teste</span><span class="per">🗓️ '+m.per+' · '+m.sapt+'</span></span><span class="go">→</span>';
    b.onclick=()=>openMod(m);box.appendChild(b);
  });
  // combinate
  const c=document.createElement("button");c.className="mbtn comb";
  c.innerHTML='<span class="n">★</span><span><span class="tt">Teste combinate</span><span class="mt">Întrebări din toate modulele · '+DATA.combined.length+' teste</span></span><span class="go">→</span>';
  c.onclick=()=>openCombined();$("mods").appendChild(c);
}
function roman(n){return ["","I","II","III","IV","V"][n]||n;}

// ---- teste dintr-un modul ----
function openMod(m){
  curMod={name:m.name,tests:m.tests};
  $("mhTitle").textContent=m.name+" — "+m.theme;
  $("mhTheme").textContent="Conținut aliniat la manualul "+DATA.manual+".";
  $("mhPer").textContent="🗓️ "+m.per+" · "+m.sapt;
  const comps=[...new Set(m.tests.flatMap(t=>t.cmp))].sort();
  $("mhChips").innerHTML=comps.map(c=>'<span class="chip">Comp. '+c+'</span>').join("");
  renderTests(m.tests);
  setBack(()=>{show("pickMod");setBack("menu");});
  show("pickTest");
}
function openCombined(){
  curMod={name:"Teste combinate",tests:DATA.combined};
  $("mhTitle").textContent="Teste combinate";
  $("mhTheme").textContent="Întrebări amestecate din toate cele 5 module.";
  $("mhPer").textContent="";
  const comps=[...new Set(DATA.combined.flatMap(t=>t.cmp))].sort();
  $("mhChips").innerHTML=comps.map(c=>'<span class="chip">Comp. '+c+'</span>').join("");
  renderTests(DATA.combined);
  setBack(()=>{show("pickMod");setBack("menu");});
  show("pickTest");
}
function renderTests(tests){
  const box=$("tests");box.innerHTML="";
  tests.forEach((t,i)=>{
    const b=document.createElement("button");b.className="mbtn";
    b.innerHTML='<span class="n">'+(i+1)+'</span><span><span class="tt">'+t.n+'</span><span class="mt">'+t.q.length+' întrebări</span><span class="chips">'+t.cmp.map(c=>'<span class="chip">'+c+'</span>').join("")+'</span></span><span class="go">→</span>';
    b.onclick=()=>startTest(t);box.appendChild(b);
  });
}

// ---- quiz ----
function startTest(t){
  qs=t.q;idx=0;score=0;
  $("scoreWrap").classList.remove("hidden");
  setBack(()=>{show("pickTest");$("scoreWrap").classList.add("hidden");});
  show("game");render();
}
function render(){
  const q=qs[idx];answered=false;
  $("qn").textContent="Întrebarea "+(idx+1)+" / "+qs.length;
  $("cmp").textContent="Competența "+q.cmp;
  $("qt").textContent=q.q;$("barI").style.width=(idx/qs.length*100)+"%";$("score").textContent=score;
  const box=$("opts");box.innerHTML="";
  q.opts.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML='<span class="lt">'+LET[i]+'</span><span>'+o+'</span>';b.onclick=()=>pick(b,i);box.appendChild(b);});
  $("explain").classList.add("hidden");$("fact").classList.add("hidden");$("next").classList.add("hidden");
}
function pick(btn,i){
  if(answered)return;answered=true;const q=qs[idx];
  [...document.querySelectorAll(".opt")].forEach((b,j)=>{if(j===q.c)b.classList.add("correct");else if(b===btn)b.classList.add("wrong");else b.classList.add("dim");b.onclick=null;});
  if(i===q.c){score++;$("score").textContent=score;}
  $("explainText").textContent=q.e;$("explain").classList.remove("hidden");
  if(q.f){$("factText").textContent=q.f;$("fact").classList.remove("hidden");}
  $("next").classList.remove("hidden");
}
$("next").onclick=()=>{idx++;if(idx>=qs.length)finish();else render();};
function finish(){
  $("barI").style.width="100%";$("scoreWrap").classList.add("hidden");
  const tot=qs.length;$("finalScore").textContent=score+"/"+tot;
  const pct=score/tot;let m;if(pct>=.9)m="Excelent! 🏆";else if(pct>=.7)m="Foarte bine! 👏";else if(pct>=.5)m="Bine, mai exersează 🙂";else m="Mai citește lecția 💪";
  $("finalMsg").textContent=m;$("finalSub").textContent=curMod.name+" · ai răspuns corect la "+score+" din "+tot+".";
  setBack(()=>{show("pickTest");});
  show("end");
}
$("againTest").onclick=()=>{show("pickTest");};
$("againMod").onclick=()=>{show("pickMod");setBack("menu");};

buildMods();setBack("menu");show("pickMod");
</script>
</body></html>

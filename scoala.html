<!DOCTYPE html>
<html lang="ro"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste Școlare</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#176b63">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4efe3;--ink:#23303d;--accent:#2563a8;--accent2:#c9872a;--card:#fffdf8;--line:#d9cfba;--good:#2f8f5b;--bad:#c23b3b;--muted:#6b6454;--shadow:0 5px 15px rgba(20,40,40,.14);--info:#e8f0fa;--infoline:#a9c6e8;--fact:#fbf3df;--factline:#e4c98a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#161d24;--ink:#eef2f4;--accent:#5b9be0;--card:#1f2932;--line:#36424d;--muted:#9aa4ad;--shadow:0 6px 20px rgba(0,0,0,.4);--info:#182636;--infoline:#2d4b6e;--fact:#2a2418;--factline:#5c4a22}}
*{margin:0;box-sizing:border-box}html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px 14px calc(18px + env(safe-area-inset-bottom))}
.backlink{align-self:flex-start;color:var(--accent);font-weight:700;text-decoration:none;font-size:13px;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;box-shadow:var(--shadow);margin-bottom:8px}
.wrap{width:100%;max-width:480px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:6px}
h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:clamp(20px,5.5vw,26px);line-height:1}
h1 small{display:block;font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:700;font-size:13px;box-shadow:var(--shadow);white-space:nowrap}
.stat b{color:var(--accent)}
.subject{text-align:center;font-weight:700;color:var(--muted);font-size:14px;margin:2px 0 12px}
.subject b{color:var(--accent)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pick-h{text-align:center;font-weight:700;color:var(--muted);margin:2px 0 12px;font-size:14px}
.units{display:grid;gap:10px}
.ubtn{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;box-shadow:var(--shadow);font-family:inherit;color:inherit;text-align:left}
.ubtn:active{transform:scale(.98)}
.ubtn .n{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:16px}
.ubtn .tt{font-weight:700;font-size:15px;line-height:1.2}
.ubtn .cc{font-size:12px;color:var(--muted)}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:var(--shadow);margin-bottom:14px;min-height:96px;display:flex;flex-direction:column;justify-content:center}
.qbox .qn{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.qbox .qt{font-family:"Bricolage Grotesque";font-weight:700;font-size:clamp(18px,4.4vw,22px);line-height:1.2}
.opts{display:grid;gap:10px}
.opt{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:700;font-size:16px;padding:15px 14px;border-radius:13px;cursor:pointer;box-shadow:var(--shadow);text-align:left;transition:.1s;display:flex;gap:10px;align-items:center}
.opt .lt{width:26px;height:26px;flex:none;border-radius:7px;background:var(--line);color:var(--ink);display:grid;place-items:center;font-size:14px}
.opt:active{transform:scale(.98)}
.opt.correct{background:var(--good);color:#fff;border-color:var(--good)}.opt.correct .lt{background:rgba(255,255,255,.25);color:#fff}
.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}.opt.wrong .lt{background:rgba(255,255,255,.25);color:#fff}
.opt.dim{opacity:.5}
.box{margin-top:12px;border-radius:14px;padding:13px 15px;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.box .bl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.box .bt{font-size:15px;line-height:1.45}
.explain{background:var(--info);border:1px solid var(--infoline)}.explain .bl{color:var(--accent)}
.factb{background:var(--fact);border:1px solid var(--factline)}.factb .bl{color:var(--accent2)}
.foot{margin-top:14px;display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
button.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
button.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.result{text-align:center;padding:24px 10px}
.result .big{font-family:"Bricolage Grotesque";font-weight:800;font-size:56px;color:var(--accent);line-height:1}
.result .msg{font-size:17px;margin:10px 0 6px;font-weight:600}
.result .sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.hidden{display:none}
</style></head>

<a class="backlink" href="index.html">&#8592; Meniu</a>
<div class="wrap">
  <header><h1><small>Teste școlare</small>Test</h1><div class="stat" id="scoreWrap">Scor <b id="score">0</b></div></header>
  <div class="subject">📚 <b>Educație Muzicală</b> · Clasa a V-a</div>
  <div class="bar"><i id="bar"></i></div>

  <div id="pick">
    <div class="pick-h">Alege unitatea de testat 👇</div>
    <div class="units" id="units"></div>
  </div>

  <div id="game" class="hidden">
    <div class="qbox"><div class="qn" id="qn"></div><div class="qt" id="qt"></div></div>
    <div class="opts" id="opts"></div>
    <div class="box explain hidden" id="explain"><div class="bl">✅ Explicație</div><div class="bt" id="explainText"></div></div>
    <div class="box factb hidden" id="fact"><div class="bl">💡 Știați că…?</div><div class="bt" id="factText"></div></div>
    <div class="foot"><button class="btn primary hidden" id="next">Următoarea &#8594;</button></div>
  </div>

  <div id="end" class="result hidden">
    <div class="big" id="finalScore">0/0</div>
    <div class="msg" id="finalMsg"></div>
    <div class="sub" id="finalSub"></div>
    <div class="foot"><button class="btn primary" id="again">Altă unitate</button></div>
  </div>
</div>

<script>
const U=[{"t":"Unitatea 1 · Cânt și notație muzicală","s":"Portativ, note, durate","q":[{"q":"Câte linii are portativul?","opts":["4","5","6"],"c":1,"e":"Portativul are 5 linii și 4 spații, pe care se scriu notele.","f":"Știați că înainte de portativ, muzica se nota cu niște semne numite neume, scrise deasupra textului?"},{"q":"Câte note muzicale de bază există?","opts":["5","7","8"],"c":1,"e":"Cele 7 note sunt: do, re, mi, fa, sol, la, si.","f":"Știați că numele notelor vine dintr-un imn latin? Guido d'Arezzo a luat prima silabă a fiecărui vers: Ut-Re-Mi-Fa-Sol-La; „Ut” a devenit mai târziu „Do”."},{"q":"Ce cheie se folosește cel mai des la începutul portativului?","opts":["Cheia sol","Cheia fa","Cheia do"],"c":0,"e":"Cheia sol (cheia violinei) fixează nota sol pe linia a doua.","f":"Știați că semnul cheii sol este, de fapt, litera G stilizată? În notația internațională, nota sol se numește „G”."},{"q":"Ce arată înălțimea unui sunet?","opts":["Cât de tare e","Cât de înalt sau jos e","Cât de lung e"],"c":1,"e":"Înălțimea ne spune dacă un sunet e mai ascuțit (înalt) sau mai grav (jos).","f":"Știați că urechea omului aude sunete de la circa 20 până la 20.000 de vibrații pe secundă?"},{"q":"Care notă durează cel mai mult?","opts":["Pătrimea","Doimea","Nota întreagă"],"c":2,"e":"Nota întreagă ține 4 timpi; doimea 2; pătrimea 1.","f":"Știați că o notă întreagă valorează cât 4 pătrimi la un loc?"},{"q":"Cât valorează o doime față de o pătrime?","opts":["De două ori mai mult","La fel","De două ori mai puțin"],"c":0,"e":"O doime (2 timpi) durează cât două pătrimi.","f":""},{"q":"Ce este pauza în muzică?","opts":["Un sunet lung","Un moment de tăcere","Un sunet înalt"],"c":1,"e":"Pauza arată un moment de liniște, cu durată măsurată, ca și notele.","f":"Știați că și tăcerea face parte din muzică? Pauzele dau ritm și respirație melodiei."},{"q":"Cum se numește citirea cântată a notelor?","opts":["Solfegiu","Portativ","Diapazon"],"c":0,"e":"Solfegiul înseamnă a citi notele cântându-le pe nume (do-re-mi...).","f":""},{"q":"Ce sunt liniuțele verticale care împart portativul?","opts":["Bare de măsură","Chei","Pauze"],"c":0,"e":"Barele de măsură împart portativul în măsuri egale.","f":""},{"q":"Distanța dintre do și următorul do se numește:","opts":["Gamă","Octavă","Acord"],"c":1,"e":"O octavă cuprinde cele 7 note plus revenirea la do.","f":"Știați că se numește octavă fiindcă e a opta treaptă (octo = opt în latină)?"},{"q":"Ce dă sunetul de referință la pentru acordaj?","opts":["Metronomul","Diapazonul","Portativul"],"c":1,"e":"Diapazonul produce nota la standard, după care se acordează instrumentele.","f":"Știați că nota la de acordaj vibrează de 440 de ori pe secundă și e la fel în toată lumea?"},{"q":"Do central se scrie, în cheia sol:","opts":["Pe linia de sus","Pe o liniuță sub portativ","În cheia fa"],"c":1,"e":"Do central stă pe o liniuță suplimentară sub portativ, în cheia sol.","f":""}]},{"t":"Unitatea 2 · Elemente de folclor","s":"Doină, colinde, instrumente","q":[{"q":"Cum se numește cântecul popular românesc trist, de dor?","opts":["Hora","Doina","Colinda"],"c":1,"e":"Doina exprimă dor, jale sau singurătate și e liberă ca ritm.","f":"Știați că doina românească e înscrisă din 2009 pe lista UNESCO a patrimoniului cultural al omenirii?"},{"q":"Când se cântă colindele?","opts":["De Paște","De Crăciun","Vara"],"c":1,"e":"Colindele sunt cântece de sărbătoare, specifice Crăciunului.","f":"Știați că unele colinde românești au peste 500 de ani și se transmit din generație în generație?"},{"q":"Ce instrument popular e făcut din mai multe tuburi de trestie?","opts":["Naiul","Cobza","Vioara"],"c":0,"e":"Naiul are mai multe tuburi de lungimi diferite, fiecare cu alt sunet.","f":"Știați că Gheorghe Zamfir a făcut naiul românesc celebru în toată lumea, cântând chiar în filme?"},{"q":"Hora este:","opts":["Un cântec de leagăn","Un joc popular în cerc","Un instrument"],"c":1,"e":"Hora e un dans popular în care oamenii se prind de mâini în cerc.","f":"Știați că hora se joacă de obicei în cerc, simbol al unității comunității?"},{"q":"Ce instrument popular de suflat e un tub simplu de lemn?","opts":["Fluierul","Țambalul","Cobza"],"c":0,"e":"Fluierul e un instrument de suflat din lemn, folosit mult de ciobani.","f":""},{"q":"Ce instrument popular cu coarde se lovește cu ciocănele?","opts":["Cobza","Țambalul","Naiul"],"c":1,"e":"Țambalul are coarde întinse, lovite cu două ciocănele mici.","f":"Știați că un țambal mare poate avea peste 100 de coarde?"},{"q":"Cimpoiul produce sunetul folosind:","opts":["Un burduf cu aer","Coarde","Ciocănele"],"c":0,"e":"Cimpoiul are un burduf din care aerul iese prin tuburi sonore.","f":""},{"q":"Cum se numesc cântecele care povestesc fapte eroice?","opts":["Balade","Colinde","Doine"],"c":0,"e":"Balada e un cântec-poveste despre eroi și întâmplări vechi.","f":"Știați că balada Miorița e una dintre cele mai cunoscute creații populare românești?"},{"q":"Marele compozitor român inspirat din folclor a fost:","opts":["George Enescu","Vivaldi","Mozart"],"c":0,"e":"George Enescu a folosit melodii populare în Rapsodiile Române.","f":"Știați că George Enescu a compus prima Rapsodie Română la doar 20 de ani?"},{"q":"Cântăreața legendară a folclorului românesc a fost:","opts":["Maria Tănase","Maria Callas","Celine Dion"],"c":0,"e":"Maria Tănase e numită pasărea măiastră a cântecului popular.","f":"Știați că Maria Tănase era atât de iubită încât a fost supranumită pasărea măiastră?"},{"q":"Cântecul pe care mama îl cântă bebelușului e:","opts":["Cântec de leagăn","Baladă","Horă"],"c":0,"e":"Cântecul de leagăn e domol și liniștitor, pentru adormit copilul.","f":""}]},{"t":"Unitatea 3 · Măsuri și gesturi dirijorale","s":"Măsură, timp, dirijat","q":[{"q":"Măsura 2/4 are câți timpi?","opts":["2","3","4"],"c":0,"e":"Măsura 2/4 are 2 timpi, fiecare valorând o pătrime.","f":"Știați că măsura 2/4 e tipică marșurilor, fiindcă seamănă cu pașii: stânga-dreapta?"},{"q":"Câți timpi are măsura de vals, 3/4?","opts":["2","3","4"],"c":1,"e":"Valsul se numără în 3 timpi: un-doi-trei.","f":"Știați că valsul, în măsură de 3 timpi, a cucerit saloanele Europei în secolul al XIX-lea?"},{"q":"Cine conduce o orchestră sau un cor?","opts":["Solistul","Dirijorul","Compozitorul"],"c":1,"e":"Dirijorul coordonează toți muzicienii prin gesturi.","f":"Știați că dirijorul nu scoate niciun sunet, dar fără el zeci de muzicieni n-ar cânta la unison?"},{"q":"Cu ce ține dirijorul ritmul, deseori, în mână?","opts":["O baghetă","Un fluier","O vioară"],"c":0,"e":"Bagheta e bețișorul subțire cu care dirijorul marchează timpii.","f":""},{"q":"Primul timp al măsurii este de obicei:","opts":["Mai slab","Accentuat (mai tare)","Tăcut"],"c":1,"e":"Primul timp e accentuat; pe el cade pulsul principal.","f":"Știați că tocmai acest accent ne ajută să simțim unde începe fiecare măsură?"},{"q":"O măsură cu 4 timpi se scrie:","opts":["2/4","3/4","4/4"],"c":2,"e":"Măsura 4/4 are patru pătrimi; e cea mai folosită.","f":"Știați că măsura 4/4 e atât de comună încât se mai numește și măsură obișnuită?"},{"q":"Un timp al măsurii reprezintă:","opts":["O pauză lungă","O bătaie regulată a pulsului","Un instrument"],"c":1,"e":"Timpul e pulsația regulată după care simțim ritmul.","f":""},{"q":"Măsura cu 2 timpi se numește:","opts":["Binară","Ternară","Liberă"],"c":0,"e":"Măsura binară (2 timpi) alternează un timp tare cu unul slab.","f":""},{"q":"Ce arată cifra de jos a măsurii (ex. 4 din 3/4)?","opts":["Câți timpi","Felul notei care ține un timp","Tempoul"],"c":1,"e":"Cifra de jos arată ce valoare de notă primește un timp (4 = pătrime).","f":""},{"q":"Gesturile dirijorale servesc la:","opts":["A arăta intrările și ritmul","A cânta mai tare singur","A scrie notele"],"c":0,"e":"Dirijorul arată prin mâini când intră fiecare și cât de tare.","f":""}]},{"t":"Unitatea 4 · Gama majoră și gama minoră","s":"Game, tonalitate, ton și semiton","q":[{"q":"Gama Do major începe și se termină pe nota:","opts":["Do","Sol","La"],"c":0,"e":"Gama Do major urcă de la do până la do-ul următor.","f":"Știați că gama Do major se cântă doar pe clapele albe ale pianului?"},{"q":"Câte trepte (note) are o gamă?","opts":["5","7","9"],"c":1,"e":"Gama are 7 trepte, apoi revine la prima notă (octava).","f":""},{"q":"Cea mai mică distanță între două sunete vecine e:","opts":["Ton","Semiton","Octavă"],"c":1,"e":"Semitonul e cel mai mic pas; două semitonuri fac un ton.","f":"Știați că la pian, de la o clapă la cea imediat următoare e exact un semiton?"},{"q":"Muzica veselă, luminoasă, e de obicei în mod:","opts":["Major","Minor","Mut"],"c":0,"e":"Modul major sună luminos și vesel; cel minor, mai trist.","f":"Știați că aceeași melodie trecută din major în minor poate suna dintr-odată tristă?"},{"q":"Muzica tristă, melancolică, e de obicei în mod:","opts":["Major","Minor","Rapid"],"c":1,"e":"Modul minor dă un caracter trist, duios muzicii.","f":""},{"q":"Prima treaptă a gamei, cea mai importantă, e:","opts":["Tonica","Octava","Pauza"],"c":0,"e":"Tonica e nota de bază care dă numele gamei (do în Do major).","f":""},{"q":"Trei sau mai multe sunete cântate simultan formează un:","opts":["Acord","Solfegiu","Portativ"],"c":0,"e":"Acordul înseamnă mai multe note sunând în același timp, armonios.","f":"Știați că o chitară care cântă un acord produce mai multe note deodată?"},{"q":"Gama La minor folosește aceleași note ca:","opts":["Do major","Sol major","Fa major"],"c":0,"e":"La minor e ruda lui Do major: aceleași clape albe, altă tonică.","f":""},{"q":"Șirul de sunete urcând sau coborând în ordine se numește:","opts":["Gamă","Acord","Pauză"],"c":0,"e":"Gama e șirul de note în ordine, treaptă cu treaptă.","f":""},{"q":"Între mi-fa și si-do distanța este de:","opts":["Un ton","Un semiton","O octavă"],"c":1,"e":"Acolo există semiton natural; de aceea nu au clapă neagră între ele.","f":"Știați că tocmai de asta pianul nu are clapă neagră între mi-fa și si-do?"}]},{"t":"Unitatea 5 · Tempo, nuanțe și timbru","s":"Viteză, intensitate, culoarea sunetului","q":[{"q":"Ce arată tempoul unei piese?","opts":["Cât de tare se cântă","Cât de repede se cântă","Cât de înalt e sunetul"],"c":1,"e":"Tempoul e viteza cu care se desfășoară muzica.","f":"Știați că tempoul se măsoară în bătăi pe minut (BPM), cu un aparat numit metronom?"},{"q":"Termenul allegro înseamnă un tempo:","opts":["Lent","Vesel și rapid","Foarte lent"],"c":1,"e":"Allegro = repede, vioi. Adagio și largo sunt lente.","f":"Știați că indicațiile de tempo sunt în italiană, fiindcă marii compozitori din trecut le-au fixat în această limbă?"},{"q":"Piano (p) în muzică înseamnă să cânți:","opts":["Tare","Încet (slab)","Repede"],"c":1,"e":"Piano = încet; forte = tare. Sunt nuanțe de intensitate.","f":"Știați că pianul se numește așa de la piano-forte, fiindcă putea cânta și încet, și tare?"},{"q":"Forte (f) înseamnă să cânți:","opts":["Tare","Încet","Lent"],"c":0,"e":"Forte cere un sunet puternic, viguros.","f":""},{"q":"Creșterea treptată a intensității se numește:","opts":["Crescendo","Decrescendo","Andante"],"c":0,"e":"Crescendo = tot mai tare; decrescendo = tot mai încet.","f":"Știați că un crescendo bine făcut poate da fiori, ca o furtună care se apropie?"},{"q":"Ce ne ajută să deosebim o vioară de un pian la aceeași notă?","opts":["Timbrul","Tempoul","Nuanța"],"c":0,"e":"Timbrul e culoarea sunetului, specifică fiecărui instrument sau voce.","f":"Știați că, la fel ca vocea fiecărui om, fiecare instrument are timbrul lui unic?"},{"q":"Cea mai înaltă voce feminină este:","opts":["Sopran","Alt","Bas"],"c":0,"e":"Sopran = voce feminină înaltă; bas = voce masculină gravă.","f":"Știați că vocea de sopran poate ajunge atât de sus încât, se spune, poate sparge un pahar de sticlă?"},{"q":"Cea mai gravă voce bărbătească este:","opts":["Tenor","Bas","Sopran"],"c":1,"e":"Basul e vocea masculină cea mai joasă.","f":""},{"q":"Vioara, violoncelul și contrabasul sunt instrumente cu:","opts":["Coarde","Suflat","Percuție"],"c":0,"e":"Sunetul lor vine din coarde, de obicei frecate cu arcușul.","f":"Știați că arcușul viorii este făcut, de obicei, din păr de cal?"},{"q":"Toba, tamburina și xilofonul sunt instrumente de:","opts":["Coarde","Suflat","Percuție"],"c":2,"e":"La percuție sunetul se obține prin lovire sau scuturare.","f":""},{"q":"Un grup mare de muzicieni cântând împreună se numește:","opts":["Orchestră","Solist","Duet"],"c":0,"e":"Orchestra reunește zeci de instrumente conduse de dirijor.","f":"Știați că o orchestră simfonică mare poate avea peste 90 de muzicieni pe scenă odată?"},{"q":"Instrumentul cu clape, cu 88 de clape, este:","opts":["Pianul","Vioara","Naiul"],"c":0,"e":"Pianul are 88 de clape și acoperă sunete foarte joase și foarte înalte.","f":"Știați că pianul are 88 de clape: 52 albe și 36 negre?"}]}];
const $=id=>document.getElementById(id);
const LET=["A","B","C","D"];
let qs,idx,score,answered,uname;
function buildUnits(){
  const box=$("units");box.innerHTML="";
  U.forEach((u,i)=>{const b=document.createElement("button");b.className="ubtn";
    b.innerHTML='<span class="n">'+(i+1)+'</span><span><span class="tt">'+u.t.split("·")[1].trim()+'</span><span class="cc">'+u.q.length+' întrebări</span></span>';
    b.onclick=()=>start(i);box.appendChild(b);});
  // test general
  const b=document.createElement("button");b.className="ubtn";
  b.innerHTML='<span class="n" style="background:var(--accent2)">★</span><span><span class="tt">Test general (toate unitățile)</span><span class="cc">30 întrebări amestecate</span></span>';
  b.onclick=()=>startGeneral();box.appendChild(b);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(i){uname=U[i].t.split("·")[1].trim();qs=U[i].q.slice();begin();}
function startGeneral(){uname="Test general";let all=[];U.forEach(u=>u.q.forEach(q=>all.push(q)));qs=shuffle(all).slice(0,30);begin();}
function begin(){idx=0;score=0;$("pick").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");render();}
function render(){
  const q=qs[idx];answered=false;
  $("qn").textContent="Întrebarea "+(idx+1)+" din "+qs.length+" · "+uname;
  $("qt").textContent=q.q;$("bar").style.width=(idx/qs.length*100)+"%";$("score").textContent=score;
  const box=$("opts");box.innerHTML="";
  q.opts.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML='<span class="lt">'+LET[i]+'</span><span>'+o+'</span>';b.onclick=()=>pick(b,i);box.appendChild(b);});
  $("explain").classList.add("hidden");$("fact").classList.add("hidden");$("next").classList.add("hidden");
}
function pick(btn,i){
  if(answered)return;answered=true;
  const q=qs[idx];[...document.querySelectorAll(".opt")].forEach((b,j)=>{if(j===q.c)b.classList.add("correct");else if(b===btn)b.classList.add("wrong");else b.classList.add("dim");b.onclick=null;});
  if(i===q.c){score++;$("score").textContent=score;}
  $("explainText").textContent=q.e;$("explain").classList.remove("hidden");
  if(q.f){$("factText").textContent=q.f;$("fact").classList.remove("hidden");}
  $("next").classList.remove("hidden");
}
$("next").onclick=()=>{idx++;if(idx>=qs.length)finish();else render();};
function finish(){
  $("bar").style.width="100%";$("game").classList.add("hidden");$("end").classList.remove("hidden");
  const tot=qs.length;$("finalScore").textContent=score+"/"+tot;
  const pct=score/tot;let m;if(pct>=.9)m="Excelent! 🏆";else if(pct>=.7)m="Foarte bine! 👏";else if(pct>=.5)m="Bine, dar mai exersează 🙂";else m="Mai citește lecția 💪";
  $("finalMsg").textContent=m;$("finalSub").textContent=uname+" · ai răspuns corect la "+score+" din "+tot+".";
}
$("again").onclick=()=>{$("end").classList.add("hidden");$("game").classList.add("hidden");$("pick").classList.remove("hidden");$("bar").style.width="0";$("score").textContent="0";};
buildUnits();
</script>

<!DOCTYPE html>
<html lang="ro"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Cultură Generală</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#176b63">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4efe3;--ink:#23303d;--accent:#7a3aa0;--accent2:#c9872a;--card:#fffdf8;--line:#d9cfba;--good:#2f8f5b;--bad:#c23b3b;--muted:#6b6454;--shadow:0 5px 15px rgba(20,40,40,.14);--fact:#fbf3df;--factline:#e4c98a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#161d24;--ink:#eef2f4;--accent:#b07fd0;--card:#1f2932;--line:#36424d;--muted:#9aa4ad;--shadow:0 6px 20px rgba(0,0,0,.4);--fact:#2a2418;--factline:#5c4a22}}
*{margin:0;box-sizing:border-box}html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px 14px calc(18px + env(safe-area-inset-bottom))}
.backlink{align-self:flex-start;color:var(--accent);font-weight:700;text-decoration:none;font-size:13px;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;box-shadow:var(--shadow);margin-bottom:8px}
.wrap{width:100%;max-width:480px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:clamp(20px,5.5vw,26px);line-height:1}
h1 small{display:block;font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:700;font-size:13px;box-shadow:var(--shadow);white-space:nowrap}
.stat b{color:var(--accent)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pick-h{text-align:center;font-weight:700;color:var(--muted);margin:4px 0 10px;font-size:14px}
.levelsel{display:flex;gap:7px;margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow)}
.levelsel button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink);font-family:inherit;font-weight:700;font-size:13.5px;padding:9px 4px;border-radius:9px;cursor:pointer}
.levelsel button.on{background:var(--accent);color:#fff}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 10px;cursor:pointer;box-shadow:var(--shadow);font-family:inherit;color:inherit}
.tbtn:active{transform:scale(.97)}
.tbtn.all{grid-column:1 / -1;flex-direction:row;justify-content:center;gap:10px}
.tbtn .e{font-size:28px}.tbtn.all .e{font-size:24px}
.tbtn .t{font-family:"Bricolage Grotesque";font-weight:800;font-size:15px}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:var(--shadow);margin-bottom:14px;text-align:center;min-height:118px;display:flex;flex-direction:column;justify-content:center}
.qbox .qn{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.qbox .qt{font-family:"Bricolage Grotesque";font-weight:700;font-size:clamp(19px,4.6vw,24px);line-height:1.18}
.opts{display:grid;gap:10px}
.opt{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:700;font-size:16px;padding:15px 14px;border-radius:13px;cursor:pointer;box-shadow:var(--shadow);text-align:left;transition:.1s}
.opt:active{transform:scale(.98)}
.opt.correct{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.5}
.factbox{margin-top:14px;background:var(--fact);border:1px solid var(--factline);border-radius:14px;padding:14px 16px;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.factbox .fl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:5px}
.factbox .ft{font-size:15px;line-height:1.45;color:var(--ink)}
.foot{margin-top:14px;display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
button.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
button.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.result{text-align:center;padding:24px 10px}
.result .big{font-family:"Bricolage Grotesque";font-weight:800;font-size:56px;color:var(--accent);line-height:1}
.result .msg{font-size:17px;margin:10px 0 6px;font-weight:600}
.result .sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.hidden{display:none}
</style><script src="view.js" defer></script>
<script src="cookies.js" defer></script>
</head>

<div class="wrap">
  <header>
    <h1><small>Joc de minte</small>Quiz</h1>
    <div class="stat" id="scoreWrap">Scor <b id="score">0</b></div>
  </header>
  <div class="bar"><i id="bar"></i></div>

  <div id="pick">
    <div class="pick-h">Alege dificultatea și tema 👇</div>
    <div class="levelsel" id="levelsel">
      <button data-l="Începător">Începător</button>
      <button data-l="Mediu" class="on">Mediu</button>
      <button data-l="Avansat">Avansat</button>
    </div>
    <div class="themes" id="themes"></div>
  </div>

  <div id="game" class="hidden">
    <div class="qbox"><div class="qn" id="qn"></div><div class="qt" id="qt"></div></div>
    <div class="opts" id="opts"></div>
    <div class="factbox hidden" id="fact"><div class="fl">💡 Știați că…?</div><div class="ft" id="factText"></div></div>
    <div class="foot"><button class="btn primary hidden" id="next">Următoarea &#8594;</button></div>
  </div>

  <div id="end" class="result hidden">
    <div class="big" id="finalScore">0/10</div>
    <div class="msg" id="finalMsg"></div>
    <div class="sub" id="finalSub"></div>
    <div class="foot"><button class="btn primary" id="again">Altă rundă</button></div>
  </div>
</div>

const $=id=>document.getElementById(id);
const THEMES=[{k:"__ALL__",e:"🎲",t:"Toate temele"},{k:"Astronomie",e:"🔭",t:"Astronomie"},{k:"Geografie",e:"🌍",t:"Geografie"},{k:"Istorie",e:"🏛️",t:"Istorie"},{k:"Natură",e:"🦁",t:"Natură"},{k:"Sport",e:"⚽",t:"Sport"},{k:"Muzică & Artă",e:"🎨",t:"Muzică & Artă"},{k:"Mitologie",e:"⚡",t:"Mitologie"},{k:"Cultură generală",e:"🧠",t:"Cultură gen."}];
const N=10;let qs,idx,score,answered,curLevel="Mediu",curTheme;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildThemes(){const box=$("themes");box.innerHTML="";THEMES.forEach(th=>{const b=document.createElement("button");b.className="tbtn"+(th.k==="__ALL__"?" all":"");b.innerHTML='<span class="e">'+th.e+'</span><span class="t">'+th.t+'</span>';b.onclick=()=>startTheme(th.k);box.appendChild(b);});}
document.querySelectorAll("#levelsel button").forEach(b=>{b.onclick=()=>{curLevel=b.dataset.l;document.querySelectorAll("#levelsel button").forEach(x=>x.classList.remove("on"));b.classList.add("on");};});
function startTheme(k){
  curTheme=k;
  let main=POOL.filter(x=>x.lvl===curLevel&&(k==="__ALL__"||x.theme===k));shuffle(main);
  let chosen=main.slice(0,N);
  if(chosen.length<N){const extra=shuffle(POOL.filter(x=>x.lvl===curLevel&&!chosen.includes(x)));chosen=chosen.concat(extra.slice(0,N-chosen.length));}
  qs=chosen;idx=0;score=0;
  $("pick").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");
  render();
}
function distractors(q){
  const same=POOL.filter(x=>x.a!==q.a);
  let cand=same.filter(x=>x.sub===q.sub);
  if(cand.length<3)cand=cand.concat(same.filter(x=>x.theme===q.theme&&x.sub!==q.sub));
  if(cand.length<3)cand=cand.concat(same);
  shuffle(cand);const seen=new Set(),out=[];
  for(const x of cand){if(!seen.has(x.a)){seen.add(x.a);out.push(x.a);}if(out.length>=3)break;}
  return out;
}
function factFor(q){
  if(FACTS[q.a])return FACTS[q.a];
  const tf=THEME_FACTS[q.theme];
  if(tf&&tf.length)return tf[Math.random()*tf.length|0];
  return null;
}
function render(){
  const q=qs[idx];answered=false;
  $("qn").textContent="Întrebarea "+(idx+1)+" din "+qs.length+" · "+curLevel;
  $("qt").textContent=q.c;$("bar").style.width=(idx/qs.length*100)+"%";$("score").textContent=score;
  const opts=shuffle([q.a,...distractors(q)]);
  const box=$("opts");box.innerHTML="";
  opts.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>pick(b,o,q.a);box.appendChild(b);});
  $("fact").classList.add("hidden");$("next").classList.add("hidden");
}
function pick(btn,choice,correct){
  if(answered)return;answered=true;
  document.querySelectorAll(".opt").forEach(b=>{if(b.textContent===correct)b.classList.add("correct");else if(b===btn)b.classList.add("wrong");else b.classList.add("dim");b.onclick=null;});
  if(choice===correct){score++;$("score").textContent=score;}
  const f=factFor(qs[idx]);
  if(f){$("factText").textContent=f;$("fact").classList.remove("hidden");}
  $("next").classList.remove("hidden");
}
$("next").onclick=()=>{idx++;if(idx>=qs.length)finish();else render();};
function finish(){
  $("bar").style.width="100%";$("game").classList.add("hidden");$("end").classList.remove("hidden");
  const tot=qs.length;$("finalScore").textContent=score+"/"+tot;
  const pct=score/tot;let m;if(pct>=.9)m="Geniu! 🏆";else if(pct>=.7)m="Foarte bine! 👏";else if(pct>=.5)m="Binișor 🙂";else m="Mai exersezi 💪";
  $("finalMsg").textContent=m;$("finalSub").textContent="Nivel "+curLevel+" · ai răspuns corect la "+score+" din "+tot+".";
}
$("again").onclick=()=>{$("end").classList.add("hidden");$("game").classList.add("hidden");$("pick").classList.remove("hidden");$("bar").style.width="0";};
buildThemes();
</script>
